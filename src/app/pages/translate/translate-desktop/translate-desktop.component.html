<ion-header [translucent]="true">
  <!-- <app-announcement-banner /> -->
  <ion-toolbar>
    <ion-title>
      <app-logo />
    </ion-title>
    <ion-buttons slot="secondary">
      <ion-button routerLink="/" queryParamsHandling="preserve" fill="solid" color="primary" shape="round">
        {{ 'landing.home.title' | transloco }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <div id="input-mode-group">
      <div class="heading-strip">
        <h2 class="heading-strip-title">Text</h2>
        <h2 class="heading-strip-title heading-strip-title--accent">SignLanguage</h2>
      </div>
    </div>

    <app-drop-pose-file>
      <div id="translation-card">
        <app-language-selectors />

        <div id="content">
          @if (spokenToSigned) {
            <!-- Spoken to sign requires a text input and video output -->
            <app-spoken-to-signed />
          } @else {
            <!-- Sign to spoken requires a video input and text output -->
            <app-signed-to-spoken />
          }
        </div>
      </div>
    </app-drop-pose-file>

    <app-send-feedback />
  </div>
  <app-landing-footer />
</ion-content>
